# Publication et déploiement d'Ardoiz (ADR-0008 amendée, jalons L7).
# - Tag vX.Y.Z : toutes les vérifications de la CI, textes juridiques complets, image construite et
#   poussée (version + SHA, SBOM et provenance), puis déploiement après APPROBATION du porteur
#   (environnement « production »), migrations comprises, et test de fumée sur l'adresse publique.
# - Lancement manuel avec un tag existant : RETOUR ARRIÈRE vers ce tag (sans reconstruire ni migrer).
# Aucun secret n'est écrit dans le dépôt ni affiché : ils passent par l'environnement des étapes et par
# l'entrée standard de SSH, jamais par la ligne de commande.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag déjà publié à redéployer (retour arrière), par exemple v1.0.0"
        required: true
        type: string

permissions:
  contents: read

# Un seul déploiement à la fois, jamais annulé en cours de route.
concurrency:
  group: release-production
  cancel-in-progress: false

env:
  IMAGE: dididenoble/ardoiz
  PUBLIC_URL: https://ardoiz.teamnoble.fr

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  legal:
    name: Textes juridiques complets (aucun [[…]])
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node tools/check-legal.mjs

  image:
    name: Image (construction, SBOM, publication)
    needs: [checks, legal]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          # Inventaire logiciel et provenance attachés à l'image (R19).
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.sha }}

  deploy:
    name: Déploiement en production (approbation du porteur)
    needs: [image]
    # Un tag poussé dont l'image est publiée, ou un retour arrière lancé à la main.
    if: ${{ !cancelled() && (needs.image.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://ardoiz.teamnoble.fr
    steps:
      # Script de déploiement et compose de la VERSION déployée : le tag poussé, ou le tag demandé pour
      # un retour arrière, jamais la branche depuis laquelle le workflow est lancé (verdict L7, S-3).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - id: target
        name: Version à déployer
        env:
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ needs.image.outputs.tag }}
          REQUESTED: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$REQUESTED"; mode="no-migrate"; else tag="$PUSHED"; mode="migrate"; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag invalide : $tag" >&2; exit 1; }
          # Un retour arrière ne vise qu'une image déjà publiée (pull anonyme : l'image est publique).
          docker manifest inspect "$IMAGE:$tag" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Déploiement de $tag ($mode)" >> "$GITHUB_STEP_SUMMARY"
      - name: Accès SSH (clé dédiée, hôte vérifié)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          [ -n "$KNOWN_HOSTS" ] || { echo "Variable DEPLOY_SSH_KNOWN_HOSTS absente : l'hôte ne serait pas vérifié." >&2; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ardoiz_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Fichiers de déploiement et configuration (.env régénéré à chaque déploiement)
        env:
          SSH_TARGET: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          ssh_cmd=(ssh -i ~/.ssh/ardoiz_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_TARGET")
          "${ssh_cmd[@]}" 'mkdir -p ~/ardoiz && chmod 700 ~/ardoiz'
          "${ssh_cmd[@]}" 'cat > ~/ardoiz/compose.prod.yml' < deploy/compose.prod.yml
          # Configuration de l'application : jamais l'URL du rôle propriétaire (R10, R20).
          {
            printf 'NODE_ENV=production\n'
            printf 'PUBLIC_BASE_URL=%s\n' "$PUBLIC_BASE_URL"
            printf 'LOG_LEVEL=info\n'
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_POOL_MAX=10\n'
            printf 'TRUSTED_PROXIES=%s\n' "$TRUSTED_PROXIES"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'TOTP_ENCRYPTION_KEY=%s\n' "$TOTP_ENCRYPTION_KEY"
            printf 'MAIL_TRANSPORT=brevo\n'
            printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY"
            printf 'BREVO_SENDER_EMAIL=%s\n' "$BREVO_SENDER_EMAIL"
            printf 'BREVO_SENDER_NAME=%s\n' "$BREVO_SENDER_NAME"
          } | "${ssh_cmd[@]}" 'umask 077 && cat > ~/ardoiz/.env'
          # Configuration du migrateur seul, et seulement si l'on migre (jamais pour un retour arrière) ;
          # remote-deploy.sh l'efface à sa sortie (verdict L7, S-2).
          if [ "$MODE" = "migrate" ]; then
            printf 'MIGRATION_DATABASE_URL=%s\n' "$MIGRATION_DATABASE_URL" \
              | "${ssh_cmd[@]}" 'umask 077 && cat > ~/ardoiz/.env.migrate'
          fi
      - name: Déploiement
        env:
          SSH_TARGET: ${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}
          TAG: ${{ steps.target.outputs.tag }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          ssh -i ~/.ssh/ardoiz_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$SSH_TARGET" "bash -s -- $TAG $MODE" < deploy/remote-deploy.sh
      - name: Test de fumée sur l'adresse publique
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$PUBLIC_URL/healthz"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "$PUBLIC_URL/readyz"
          # /metrics n'est jamais public (port séparé, hors Traefik).
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL/metrics")"
          [ "$status" = "404" ] || { echo "/metrics répond $status sur l'adresse publique." >&2; exit 1; }
      - name: Effacement de la clé
        if: always()
        run: rm -f ~/.ssh/ardoiz_deploy
