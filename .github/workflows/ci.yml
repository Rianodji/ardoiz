# Vérification de chaque push et de chaque pull request (R19, R20, ADR-0008).
# Aucune étape ne peut être désactivée pour « faire passer » la CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Réutilisé par release.yml : une version n'est publiée que si toutes ces vérifications passent.
  workflow_call:

# Moindre privilège : le jeton du workflow ne peut que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, architecture, tests, licences et build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Actions épinglées par empreinte de commit : une étiquette peut être déplacée, une empreinte non (R19).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Installation exacte du lockfile, sans exécuter les scripts d'installation des dépendances (R19).
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run depcruise
      - run: npm test
      # PostgreSQL 16.14 réel, démarré par Testcontainers (Docker est disponible sur le runner).
      - run: npm run test:integration
      - run: npm run licenses
      - run: npm run build

  e2e:
    name: Bout en bout (Playwright, CSP de production)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Navigateur de la version de Playwright figée dans le lockfile.
      - run: npx playwright install --with-deps chromium
      # Vraie application, vraie CSP, PostgreSQL jetable : toute violation de CSP fait échouer (verdict L3, §6).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-e2e
          path: test-results/
          retention-days: 14

  dependencies:
    name: Vulnérabilités connues et inventaire logiciel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Bloquant (R19).
      - run: npm audit --audit-level=high
      - name: Inventaire logiciel (SBOM CycloneDX)
        run: npm ci --ignore-scripts && npm run sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  image:
    name: Image de production (hadolint, actionlint, shellcheck, E2E contre l'image)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Outils de lint épinglés par empreinte, lancés depuis leur image officielle.
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e < deploy/Dockerfile
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d deploy/remote-deploy.sh tools/expand-contract.sh tools/restore-drill.sh
      - name: Construction de l'image
        run: docker build -f deploy/Dockerfile -t ardoiz:ci .
      - name: Utilisateur non root et poids de l'image
        run: |
          user="$(docker image inspect ardoiz:ci --format '{{.Config.User}}')"
          echo "Utilisateur de l'image : $user"
          case "$user" in ""|0|0:*|root|root:*) echo "L'image tourne en root." >&2; exit 1 ;; esac
          size="$(docker image inspect ardoiz:ci --format '{{.Size}}')"
          echo "Poids de l'image : $((size / 1000000)) Mo" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Toute la suite E2E, parcours complet compris, contre l'image : lecture seule, sans capacité.
      - run: npm run test:e2e
        env:
          E2E_IMAGE: ardoiz:ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-e2e-image
          path: test-results/
          retention-days: 14

  expand-contract:
    name: Expand / contract (suite du tag précédent sur le nouveau schéma)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # les tags
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: tools/expand-contract.sh

  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans les anciens commits
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
