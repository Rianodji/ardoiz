version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Laisser à la communauté le temps de détecter une version piégée avant de l'adopter (R19, M17).
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # Les types de Node suivent la version d'exécution (Node 24, .nvmrc) : pas de saut de version majeure.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      outils-de-test:
        patterns:
          ["vitest", "@vitest/*", "@testcontainers/*", "testcontainers", "jsdom", "@testing-library/*"]
      outils-de-qualite:
        patterns:
          [
            "eslint",
            "@eslint/*",
            "typescript-eslint",
            "eslint-plugin-*",
            "prettier",
            "dependency-cruiser",
            "globals",
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
